aid: rad
name: Rad.
description: >-
  Rad TV (Rad.) is a two-sided subscription video platform connecting content
  creators with consumers. For creators it offers AI-powered content enhancement
  tools — video upscaling to 4K/8K (Real-ESRGAN/ESPCN), stereo-to-surround audio
  upmixing, multilingual AI subtitling in 40+ languages, and viral thumbnail/title
  prediction with actionable recommendations — plus multi-platform monetization.
  For consumers it provides streaming plus private cloud storage with sideloading
  to PS5/PSVR2, DLNA/uPnP, RSS, and Plex/Jellyfin compatibility across web, iOS,
  Android, Android TV, Apple TV, and PlayStation. Developers build on the platform
  through a strongly-typed GraphQL API (api.rad.live/graphql), a Model Context
  Protocol (MCP) server exposing 34 agent tools, Bearer-token/API-key auth and
  OAuth 2.1 (PKCE), TUS resumable uploads, and a full published documentation site.
